# Portable policy example. This is not a runnable framework configuration.
# An operator must select actual models, tools, budgets and enforcement adapters.
version: 3
assignments:
  bounded_contract_required: true
  difficult_work_may_justify_specialist_before_failure: true
  close_after_acceptance_and_operation_reconciliation: true
  release_completed_assignment_authority: true
  related_findings: correct_authorized_direct_blocker_dependency_or_report_to_main
execution_modes:
  owner_selects_smallest_useful_mode: true
  preserve_state_operations_authority_and_budgets_on_switch: true
roles:
  main:
    model: null
    effort: task_appropriate
    user_interface: true
  supervisor:
    model: null
    effort: up_to_highest_supported_when_justified
    temporary: true
    scope: affected_blocker
    explicit_in_scope_out_of_scope_and_return_condition: required
    self_expansion_of_assignment: false
    dependency_correction_requires: prevents_declared_blocker_check_or_safe_handback_and_already_authorized
    later_main_dependencies: report_for_main_decision
    after_blocker_verification: stop_investigation_and_prepare_handback
    deferred_findings_extend_supervision: false
  workers:
    model: task_appropriate
    team_size: smallest_useful_team
ownership:
  one_active_orchestrator_per_scope: true
  runtime_atomic_transfer_required: true
  stale_assignment_fencing_required: true
  takeover_at_safe_boundary: true
  recursive_supervisors: false
escalation:
  triggers:
    - recurring_failure_after_meaningful_correction
    - contradictory_cross_component_evidence
    - unresolved_execution_ownership_or_delivery
    - architectural_or_integration_blocker
    - activity_without_useful_progress
  require_all_timers_exhausted: false
  diagnosis_or_coordination_must_materially_help: true
  known_access_outage_or_hard_limit: follow_actual_resolution_path
budgets:
  selection: record_finite_task_appropriate_limits_before_execution
  unspecified_values: choose_generous_finite_limits_within_existing_authority
  universal_short_cutoffs: false
  startup_seconds: null
  execution_seconds: null
  inactivity_seconds: null
  observation_seconds: null
  retries_per_logical_operation_failure_mode: null
  supervisor_recovery_seconds: null
  supervisor_recovery_attempts: null
  supervisor_handback_seconds: null
  overall_resource_ceiling: null
  required_resource_reserve: null
  soft_extensions: evidence_and_authority_required
  soft_threshold_outcome: inspect_progress_and_review_budget
  hard_limit_outcome: stop_new_dispatches_reconcile_and_checkpoint_actual_state
  silently_relax_user_hard_limits: false
  next_milestone_required: true
  hard_limits_enforced_outside_model: true
recovery:
  reconcile_unknown_delivery_before_mutation_retry: true
  operation_identity_and_deduplication_where_supported: true
  retry_requires_transience_or_changed_evidence_input_state: true
  read_observation_is_not_execution_attempt: true
  preserve_prior_attempts_and_failures: true
  retry_exhaustion: end_unchanged_strategy_change_approach_escalate_or_checkpoint
  supervisor_phase: finite_budget_observable_milestone_and_stop_condition
  reset_budgets_on_owner_worker_or_model_change: false
verification:
  model_claim_is_not_completion: true
  heartbeat_is_liveness_only: true
  acceptance_evidence_required: true
  observed_model_effort_or_unconfirmed: true
handback:
  main_reviews_evidence: true
  explicit_control_acceptance_required: true
  include_live_operations_and_next_step: true
  include_deferred_findings_evidence_impact_scope_and_follow_up: true
  unrelated_findings_block_acceptance: false
  rejection_requires: failed_blocker_criterion_missing_required_evidence_or_unreconciled_owned_operation
  awaiting_acceptance: quiescent_except_bounded_handback_and_owned_operation_safety
  unavailable_main: checkpoint_at_declared_handback_limit
  end_temporary_supervision: true
  release_authority_after_accepted_transfer: true
  supervisor_after_acceptance: inactive_until_new_scoped_assignment
  retained_session_grants_authority: false
  main_continuation: automatic_for_already_authorized_work_when_host_supports_it
